[project]
name = "docufunnel"
version = "0.1.0"
description = "Config-driven document ETL: mail or folder in, structured rows out"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashank" }]
keywords = [
    "pdf", "extraction", "etl", "gmail", "imap", "attachments",
    "google-sheets", "markitdown", "docling", "gemini", "ocr", "invoice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/Shanki200801/docufunnel"
Source = "https://github.com/Shanki200801/docufunnel"
Issues = "https://github.com/Shanki200801/docufunnel/issues"
Changelog = "https://github.com/Shanki200801/docufunnel/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Everything a first run needs: default normalizer + LLM extractor + Sheets.
# The `imap` source needs no extra — it is standard library only.
recommended = [
    "docufunnel[markitdown,llm,google]",
]
# Gmail source, Drive store, Sheets sink.
google = [
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]
# Default normalizer. [all] pulls markitdown's own format extras.
markitdown = ["markitdown[pdf,docx,xlsx,pptx]>=0.1.0"]
# Fallback normalizer: layout models, table structure, OCR. Heavy.
docling = ["docling>=2.15"]
# LLM extractor.
llm = ["google-genai>=1.0"]
dev = [
    "pytest>=8",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.1",
    # Used to assert the generated JSON Schema actually accepts every shipped
    # pipeline, which is the only way that schema stays honest.
    "jsonschema>=4.23",
]

[project.scripts]
docufunnel = "docufunnel.cli:main"

# Third-party adapter packages register themselves here; docufunnel.core.load_plugins
# imports every entry point in this group at startup.
[project.entry-points."docufunnel.adapters"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docufunnel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

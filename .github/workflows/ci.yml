name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # A venv, not --system: GitHub runners ship a Debian interpreter marked
      # externally-managed, which uv refuses to install into.
      - run: uv venv --allow-existing
      # docling is deliberately excluded: it pulls large ML models and the
      # suite covers the fallback mechanism with a stub instead.
      - run: uv pip install -e ".[markitdown,llm,google,dev]"
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv venv --allow-existing
      - run: uv pip install build twine
      - run: .venv/bin/python -m build -o dist
      # Catches broken long_description or metadata before a tag is cut.
      - run: .venv/bin/twine check dist/*

  apps-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dist/docufunnel.gs is what people paste, so a stale bundle ships the
      # wrong code. Rebuild and fail if it differs from what is committed.
      - run: python3 apps-script/build.py
      - name: Bundle is up to date
        run: |
          if ! git diff --exit-code -- apps-script/dist; then
            echo "::error::apps-script/dist is stale. Run: python3 apps-script/build.py"
            exit 1
          fi

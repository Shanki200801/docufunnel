name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No blanket token: each job takes only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # A venv, not --system: the runner's Debian interpreter is marked
      # externally-managed and uv refuses to install into it.
      - run: uv venv --allow-existing
      - run: uv pip install build twine
      - run: .venv/bin/python -m build -o dist
      - run: .venv/bin/twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Configure this environment on PyPI as a Trusted Publisher for the
    # docufunnel project (owner Shanki200801, repo docufunnel, workflow
    # release.yml, environment pypi). No API token is ever stored.
    environment:
      name: pypi
      url: https://pypi.org/p/docufunnel
    permissions:
      id-token: write  # mints the short-lived OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
